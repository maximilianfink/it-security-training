# act_runner configuration for the training
log:
  level: info
runner:
  file: /data/.runner
  capacity: 1
  timeout: 30m
  # jobs with "runs-on: secscan" run in our scanner image
  labels:
    - "secscan:docker://pizza-pronto/secscan"
    - "renovate:docker://renovate/renovate:44.235"
container:
  # job containers join the lab network -> they can reach gitea, registries, shop, collector
  network: pizza-pronto_default
  # use the locally built image, never pull (works offline)
  force_pull: false
  privileged: false
