# Simulates the PUBLIC npm registry (npmjs.com): anybody can publish any package.
# It is a pure local registry (no uplink), so it also works completely offline – this is
# where our lab packages (loadsh, tiny-receipt) and the packages participants publish during
# the dependency-confusion attack live. Real npm packages are mirrored by the internal registry.
storage: /verdaccio/storage/data
auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
packages:
  '**':
    access: $all
    publish: $all
    unpublish: $all
server:
  keepAliveTimeout: 60
log: { type: stdout, format: pretty, level: warn }
